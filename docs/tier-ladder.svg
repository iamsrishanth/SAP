<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="300" fill="#f4f7fb"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#122033">Loyalty tier ladder</text>

  <!-- Bronze -->
  <rect x="80" y="220" width="170" height="60" rx="10" fill="#f7e5d3" stroke="#7c4a15" stroke-width="2"/>
  <text x="165" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c4a15">Bronze</text>
  <text x="165" y="266" text-anchor="middle" font-size="12" fill="#7c4a15">0 – 499 points</text>

  <!-- Silver -->
  <rect x="285" y="160" width="170" height="60" rx="10" fill="#e8eef5" stroke="#3f5168" stroke-width="2"/>
  <text x="370" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f5168">Silver</text>
  <text x="370" y="206" text-anchor="middle" font-size="12" fill="#3f5168">500 – 1,499 points</text>

  <!-- Gold -->
  <rect x="490" y="100" width="170" height="60" rx="10" fill="#fff3b8" stroke="#8a5a00" stroke-width="2"/>
  <text x="575" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00">Gold</text>
  <text x="575" y="146" text-anchor="middle" font-size="12" fill="#8a5a00">1,500 – 2,999 points</text>

  <!-- Platinum -->
  <rect x="695" y="55" width="170" height="60" rx="10" fill="#e6f7ec" stroke="#107e3e" stroke-width="2"/>
  <text x="780" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#107e3e">Platinum</text>
  <text x="780" y="101" text-anchor="middle" font-size="12" fill="#107e3e">3,000+ points</text>

  <!-- ladder -->
  <line x1="165" y1="220" x2="285" y2="220" stroke="#64748b" stroke-width="2"/>
  <line x1="285" y1="160" x2="490" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="490" y1="100" x2="695" y2="100" stroke="#64748b" stroke-width="2"/>
  <line x1="285" y1="220" x2="285" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="490" y1="160" x2="490" y2="100" stroke="#64748b" stroke-width="2"/>
  <line x1="695" y1="100" x2="695" y2="55" stroke="#64748b" stroke-width="2"/>
  <text x="230" y="243" font-size="11" fill="#64748b">≥500</text>
  <text x="435" y="183" font-size="11" fill="#64748b">≥1,500</text>
  <text x="640" y="123" font-size="11" fill="#64748b">≥3,000</text>
</svg>